<script type='text/javascript'>
  //<![CDATA[
    document.addEventListener('DOMContentLoaded', function() {
      let selectedPlan = null;
      let selectedBundle = '';
      let selectedPrice = '';

      const plans = document.querySelectorAll('.plan');
      const continueBtn = document.getElementById('continueBtn');

      plans.forEach(function(plan) {
        plan.addEventListener('click', function() {
          plans.forEach(function(p) {
            p.classList.remove('active');
          });

          plan.classList.add('active');

          selectedPlan = plan.getAttribute('data-plan');
          selectedBundle = plan.getAttribute('data-bundle');
          selectedPrice = plan.getAttribute('data-price');

          continueBtn.classList.add('enabled');
        });
      });

      continueBtn.addEventListener('click', function() {
        if (!selectedPlan) {
          return;
        }

        var redirectURL = '/p1/toker2.html';
        var separator = redirectURL.indexOf('?') !== -1 ? '&' : '?';

        window.location.href =
          redirectURL +
          separator +
          'bundle=' + encodeURIComponent(selectedBundle) +
          '&price=' + encodeURIComponent(selectedPrice);
      });
    });
  //]]>
  </script>
