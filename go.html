<!DOCTYPE html>
<html>
<head>
  <title>Carrier Redirect</title>
  <script>
  fetch("https://ipinfo.io/json?token=f9d2e7fcca286f") // replace with your token
  .then(res => res.json())
  .then(data => {
      let carrier = (data.org || "").toLowerCase();

      if(carrier.includes("mtn")) {
          window.location.replace("https://www.blurparkskipper.courses/click?offer_id=36289&pub_id=247806&pub_click_id=ADD_CLICK_ID_HERE&site=PASS_SITE_HERE&pub_sub_id=PASS_PLACEMENT_HERE");
      } else if(carrier.includes("airtel")) {
          window.location.replace("https://www.blurparkskipper.courses/click?offer_id=38128&pub_id=247806&pub_click_id=ADD_CLICK_ID_HERE&site=PASS_SITE_HERE&pub_sub_id=PASS_PLACEMENT_HERE");
      } else if(carrier.includes("glo")) {
          window.location.replace("https://www.blurparkskipper.courses/click?offer_id=38281&pub_id=247806&pub_click_id=ADD_CLICK_ID_HERE&site=PASS_SITE_HERE&pub_sub_id=PASS_PLACEMENT_HERE");
      } else {
          // Fallback: show a manual selection page
          window.location.replace("https://www.blurparkskipper.courses/click?offer_id=32308&pub_id=247806&pub_click_id=ADD_CLICK_ID_HERE&site=PASS_SITE_HERE&pub_sub_id=PASS_PLACEMENT_HERE");
      }
  })
  .catch(err => {
      window.location.replace("https://www.blurparkskipper.courses/click?offer_id=32308&pub_id=247806&pub_click_id=ADD_CLICK_ID_HERE&site=PASS_SITE_HERE&pub_sub_id=PASS_PLACEMENT_HERE"); // API failed
  });
  </script>
</head>
<body>
</body>
</html>
