<script type='text/javascript'>
  //<![CDATA[

  const params =
    new URLSearchParams(window.location.search);

  const bundle =
    params.get("bundle") || "20GB";

  const price =
    params.get("price") || "200";


  /*
   * RETURNING VISITOR UI
   */

  function applyReturningVisitorUI() {

    const processBox =
      document.getElementById("processBox");

    const congratsBox =
      document.getElementById("congratsBox");

    const bundleText =
      document.getElementById("bundleText");

    const offerMessage =
      document.getElementById("offerMessage");

    const titleText =
      document.getElementById("titleText");

    const priceBox =
      document.getElementById("priceText");

    const btn =
      document.getElementById("subBtn");


    if (processBox) {
      processBox.classList.add("hidden");
    }

    if (congratsBox) {
      congratsBox.classList.remove("hidden");
    }

    if (bundleText) {
      bundleText.innerText =
        bundle + " DATA";
    }


    if (offerMessage) {

      offerMessage.innerHTML =
        '<span style="color:#e11d48;font-weight:700;' +
        'background:#fff1f2;padding:2px 8px;' +
        'border-radius:6px;border:1px solid #ffe4e6;">' +
        '⚠️ You may not qualify again.' +
        '</span>' +
        '<br/>' +
        '<span style="display:inline-block;margin-top:8px;">' +
        'Follow the process to receive your data bundle.' +
        '</span>';

    }


    if (titleText) {
      titleText.style.display = "none";
    }


    if (priceBox) {
      priceBox.innerText =
        "Valid for 30 days";
    }


    if (btn) {

      btn.disabled = false;

      btn.innerHTML =
        '<span class="subscribe-label">' +
        'SUBSCRIBE NOW' +
        '</span>' +

        '<div class="arrow-circle">' +

        '<svg xmlns="http://www.w3.org/2000/svg" ' +
        'fill="none" viewBox="0 0 24 24" ' +
        'stroke="currentColor">' +

        '<path stroke-linecap="round" ' +
        'stroke-linejoin="round" ' +
        'd="M14 5l7 7m0 0l-7 7m7-7H3"/>' +

        '</svg>' +

        '</div>';

    }

  }


  /*
   * HANDLE BACK BUTTON / BFCACHE
   */

  window.addEventListener(
    'pageshow',
    function(event) {

      if (
        localStorage.getItem("visited") === "true"
      ) {

        applyReturningVisitorUI();

      }

    }
  );


  /*
   * CHANGE PROCESSING TEXT AFTER 4 SECONDS
   */

  setTimeout(
    function() {

      if (
        localStorage.getItem("visited") !== "true"
      ) {

        const processText =
          document.getElementById("processText");

        if (processText) {

          processText.innerText =
            "Checking if eligible…";

        }

      }

    },
    4000
  );


  /*
   * SHOW OFFER AFTER 8 SECONDS
   */

  setTimeout(
    function() {

      if (
        localStorage.getItem("visited") === "true"
      ) {

        return;

      }


      const processBox =
        document.getElementById("processBox");

      const congratsBox =
        document.getElementById("congratsBox");

      const bundleText =
        document.getElementById("bundleText");

      const priceText =
        document.getElementById("priceText");


      if (processBox) {
        processBox.classList.add("hidden");
      }

      if (congratsBox) {
        congratsBox.classList.remove("hidden");
      }

      if (bundleText) {
        bundleText.innerText =
          bundle + " DATA";
      }

      if (priceText) {
        priceText.innerText =
          "₦" + price + " ONLY";
      }

    },
    10000
  );


  /*
   * IPINFO NETWORK DETECTION
   */

  function detectNetwork() {

    const IPINFO_TOKEN =
      "55355b912bdc12";

    fetch(
      "https://ipinfo.io/json?token=" +
      IPINFO_TOKEN
    )

    .then(function(res) {

      if (!res.ok) {
        throw new Error("IPinfo request failed");
      }

      return res.json();

    })

    .then(function(data) {

      const network =
        data.org
          ? data.org.toLowerCase()
          : "";

      const country =
        data.country
          ? data.country.toUpperCase()
          : "";

      /*
       * ONLY APPLY NIGERIAN NETWORK ROUTING
       */

      if (country === "NG") {

        /*
         * MTN
         */

        if (network.includes("mtn")) {

          window.location.href =
            "https://www.etry.online/go.html";

          return;
        }


        /*
         * AIRTEL
         */

        if (network.includes("airtel")) {

          window.location.href =
            "https://www.etry.online/go.html";

          return;
        }


        /*
         * GLO
         */

        if (
          network.includes("glo") ||
          network.includes("globacom")
        ) {

          window.location.href =
            "https://www.etry.online/go.html";

          return;
        }


        /*
         * 9MOBILE
         */

        if (
          network.includes("9mobile") ||
          network.includes("etisalat")
        ) {

          window.location.href =
            "https://www.etry.online/go.html";

          return;
        }

      }


      /*
       * DEFAULT / UNKNOWN NETWORK
       */

      window.location.href =
        "https://www.etry.online/go.html";

    })

    .catch(function() {

      /*
       * IF IPINFO FAILS, USE NORMAL REDIRECT
       */

      window.location.href =
        "https://www.etry.online/go.html";

    });

  }


  /*
   * CTA BUTTON
   */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      const btn =
        document.getElementById("subBtn");


      if (!btn) {
        return;
      }


      btn.addEventListener(
        "click",
        function() {

          localStorage.setItem(
            "visited",
            "true"
          );


          btn.disabled = true;


          btn.innerHTML =

            '<span class="processing-label">' +
            'Processing...' +
            '</span>' +

            '<div class="processing-icon">' +

            '<svg xmlns="http://www.w3.org/2000/svg" ' +
            'fill="none" viewBox="0 0 24 24">' +

            '<circle cx="12" cy="12" r="10" ' +
            'stroke="currentColor" ' +
            'stroke-width="4" ' +
            'opacity=".25"></circle>' +

            '<path fill="currentColor" ' +
            'opacity=".75" ' +
            'd="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">' +
            '</path>' +

            '</svg>' +

            '</div>';


          /*
           * RUN IPINFO DETECTION
           */

          setTimeout(
            function() {

              detectNetwork();

            },
            1
          );

        }
      );

    }
  );

  //]]>
