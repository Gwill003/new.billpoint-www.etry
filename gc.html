<!DOCTYPE html>
<html>
<head>
  <title>Carrier Redirect</title>
  <script>
  fetch("https://ipinfo.io/json?token=908bedac2d641f") // replace with your token
  .then(res => res.json())
  .then(data => {
      let carrier = (data.org || "").toLowerCase();

      if(carrier.includes("mtn")) {
          window.location.replace("https://www.translifebuild.wiki/click?offer_id=37717&pub_id=247806&pub_click_id=ADD_CLICK_ID_HERE&site=PASS_SITE_HERE&pub_sub_id=PASS_PLACEMENT_HERE");
      } else if(carrier.includes("airtel")) {
          window.location.replace("https://maharunglobal.blogspot.com/2026/04/30k-monthly-opportunities-in-the-uk-with-visa-sponsorship-for-immigrants.html");
      } else if(carrier.includes("glo")) {
          window.location.replace("https://maharunglobal.blogspot.com/2026/04/30k-monthly-opportunities-in-the-uk-with-visa-sponsorship-for-immigrants.html");
      } else {
          // Fallback: show a manual selection page
          window.location.replace("https://maharunglobal.blogspot.com/2025/10/125k-visa-sponsorship-opportunities-for-immigrants-in-the-usa.html");
      }
  })
  .catch(err => {
      window.location.replace("https://maharunglobal.blogspot.com/2025/10/125k-visa-sponsorship-opportunities-for-immigrants-in-the-usa.html"); // API failed
  });
  </script>
</head>
<body>
</body>
</html>
