<script type='text/javascript'>
  //<![CDATA[
    document.addEventListener('DOMContentLoaded', function() {
      let selectedPlan = null;
      let selectedBundle = '';
      let selectedPrice = '';

      const plans = document.querySelectorAll('.plan');
      const continueBtn = document.getElementById('continueBtn');

      plans.forEach(function(plan) {
        plan.addEventListener('click', function() {
          plans.forEach(function(p) {
            p.classList.remove('active');
          });

          plan.classList.add('active');

          selectedPlan = plan.getAttribute('data-plan');
          selectedBundle = plan.getAttribute('data-bundle');
          selectedPrice = plan.getAttribute('data-price');

          continueBtn.classList.add('enabled');
        });
      });


      
      continueBtn.addEventListener('click', function() {
  if (!selectedPlan) {
    return;
  }

  // Show loading screen
  var loadingOverlay = document.getElementById('loadingOverlay');
  loadingOverlay.style.display = 'flex';

  // Prevent clicking the button again
  continueBtn.disabled = true;

  // Final destination
  var redirectURL = '/gc.html';
  var separator = redirectURL.indexOf('?') !== -1 ? '&' : '?';

  // Redirect after 800ms
  setTimeout(function() {
    window.location.href =
      redirectURL +
      separator +
      'bundle=' + encodeURIComponent(selectedBundle) +
      '&price=' + encodeURIComponent(selectedPrice);
  }, 800);
});
    });

  //]]>
  </script>


</script>
